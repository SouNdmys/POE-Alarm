[package]
name = "poe-alarm-recognition"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SouNdmys/POE-Alarm"
description = "Production OCR orchestration for native POE Alarm"
rust-version = "1.88"
autobins = false

[dependencies]
poe-alarm-core = { path = "../poe-alarm-core" }
poe-alarm-monitoring = { path = "../poe-alarm-monitoring" }
poe-alarm-ocr-paddle = { path = "../poe-alarm-ocr-paddle" }
poe-alarm-ocr-win = { path = "../poe-alarm-ocr-win" }
poe-alarm-vision = { path = "../poe-alarm-vision" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bin]]
name = "recognition-screenshot-probe"
path = "src/bin/recognition_screenshot_probe.rs"

[[bin]]
name = "recognition-manifest-probe"
path = "src/bin/recognition_manifest_probe.rs"

[[bin]]
name = "recognition-structured-gate"
path = "src/bin/recognition_structured_gate.rs"

[[bin]]
name = "recognition-transient-probe"
path = "src/bin/recognition_transient_probe.rs"
