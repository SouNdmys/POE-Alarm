[package]
name = "poe-alarm-ocr-paddle"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SouNdmys/POE-Alarm"
description = "Offline PP-OCRv5 recognition backend for POE Alarm"
rust-version = "1.88"

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
poe-alarm-core = { path = "../poe-alarm-core" }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[dev-dependencies]
poe-alarm-vision = { path = "../poe-alarm-vision" }

[[bin]]
name = "paddle-ocr-probe"
path = "src/bin/paddle_ocr_probe.rs"
