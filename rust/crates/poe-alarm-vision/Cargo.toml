[package]
name = "poe-alarm-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-conscious desktop capture and POE blue-text vision hot path"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }

[[bin]]
name = "vision-hotpath-probe"
path = "src/bin/vision_hotpath_probe.rs"

[[bin]]
name = "screenshot-decode-probe"
path = "src/bin/screenshot_decode_probe.rs"
