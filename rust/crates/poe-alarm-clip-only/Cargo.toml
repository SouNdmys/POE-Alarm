[package]
name = "poe-alarm-clip-only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Throwaway lab: clipboard-only affix recognition, no pixels involved"
publish = false

[dependencies]
poe-alarm-core = { path = "../poe-alarm-core" }
poe-alarm-settings = { path = "../poe-alarm-settings" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "clip-only-lab"
path = "src/bin/clip_only_lab.rs"
