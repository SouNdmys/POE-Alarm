[package]
name = "poe-alarm-app-win"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Win32 shell for POE Alarm"
build = "build.rs"

[dependencies]
poe-alarm-alert-win = { path = "../poe-alarm-alert-win" }
poe-alarm-core = { path = "../poe-alarm-core" }
poe-alarm-platform-win = { path = "../poe-alarm-platform-win" }
poe-alarm-runtime = { path = "../poe-alarm-runtime" }
poe-alarm-settings = { path = "../poe-alarm-settings" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
embed-resource = "3.0.11"

[[bin]]
name = "poe-alarm-app-win"
path = "src/main.rs"
