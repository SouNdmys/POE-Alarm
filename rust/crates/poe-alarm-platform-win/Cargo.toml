[package]
name = "poe-alarm-platform-win"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SouNdmys/POE-Alarm"
description = "Isolated Win32 platform services for POE Alarm"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
