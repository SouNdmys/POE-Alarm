[workspace]
resolver = "2"
members = [
    "crates/poe-alarm-alert-win",
    "crates/poe-alarm-app",
    "crates/poe-alarm-clip-only",
    "crates/poe-alarm-clipboard",
    "crates/poe-alarm-core",
    "crates/poe-alarm-monitoring",
    "crates/poe-alarm-platform-win",
    "crates/poe-alarm-runtime",
    "crates/poe-alarm-settings",
]

[workspace.package]
version = "1.0.1"
authors = ["SouNd <soundmys1994@gmail.com>"]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/SouNdmys/POE-Alarm"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
